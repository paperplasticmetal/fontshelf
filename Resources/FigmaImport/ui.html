<!doctype html>
<html><head><meta charset="utf-8"><style>
body { font: 13px system-ui; padding: 20px; color: #222; background: #fafafa; }
h2 { font-size: 18px; margin-top: 0; } p { line-height: 1.5; color: #555; }
button { margin-top: 16px; border: 0; border-radius: 6px; padding: 10px 16px; background: #222; color: white; } button:disabled { opacity: .4; }
#status { white-space: pre-wrap; max-height: 190px; overflow: auto; }
</style></head><body>
<h2>Import FontShelf typeboard</h2>
<p>Choose the layout.fontshelf.json file. Each direction becomes a separate frame with editable text and shapes. Fonts must be available in Figma.</p>
<input id="file" type="file" accept=".json"><br>
<button id="import" disabled>Import layouts</button>
<p id="status" role="status"></p>
<script>
let payload = null;
const file = document.getElementById('file'), button = document.getElementById('import'), status = document.getElementById('status');
file.onchange = async () => {
  payload = null; button.disabled = true;
  try { if (!file.files[0] || file.files[0].size > 20000000) throw Error('Choose a layout file smaller than 20 MB.'); payload = JSON.parse(await file.files[0].text()); if (payload.format !== 'fontshelf-figma' || payload.version !== 1) throw Error('Not a supported FontShelf layout.'); status.textContent = payload.name + ' · ' + payload.frames.length + ' directions'; button.disabled = false; }
  catch (error) { status.textContent = error.message; }
};
button.onclick = () => { button.disabled = true; status.textContent = 'Importing…'; parent.postMessage({ pluginMessage: { type: 'import', payload } }, '*'); };
onmessage = event => { const msg = event.data.pluginMessage; if (!msg || msg.type !== 'result') return; status.textContent = msg.message; button.disabled = false; };
</script></body></html>
